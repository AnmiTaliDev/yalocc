name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          meson setup build -Dwerror=true
          meson compile -C build
      - name: Run
        run: |
          ./build/yalocc --version
          ./build/yalocc --by-file .
      - name: Install and run installed binary
        run: |
          sudo meson install -C build
          cd /tmp
          /usr/local/bin/yalocc --list-languages
          /usr/local/bin/yalocc "$GITHUB_WORKSPACE"

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Build with sanitizers
        run: |
          meson setup build -Db_sanitize=address,undefined -Db_lundef=false
          meson compile -C build
      - name: Run
        run: ./build/yalocc --by-file .
