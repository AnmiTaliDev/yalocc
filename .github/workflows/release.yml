name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against meson.build
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "version: '$version'" meson.build

  package:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deb
            image: debian:stable
            script: packaging/build-deb.sh
          - name: rpm
            image: fedora:latest
            script: packaging/build-rpm.sh
          - name: arch
            image: archlinux:latest
            script: packaging/build-arch.sh
          - name: apk
            image: alpine:latest
            script: packaging/build-apk.sh
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            -e URL="https://github.com/$GITHUB_REPOSITORY" \
            ${{ matrix.image }} sh ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
